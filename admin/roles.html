<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>角色管理｜物流報價系統</title>
  <link rel="stylesheet" href="/css/styles.css?v=20261127a">
  <link rel="stylesheet" href="/admin/users.css?v=20261127a">
</head>
<body>
  <div class="app-shell">
    <aside id="sidenav" class="sidenav no-print">
      <div class="sidenav-head">
        <p class="sidenav-label">物流報價</p>
        <button type="button" id="nav-close" class="nav-close">關閉</button>
      </div>
      <nav id="sidenav-tree" aria-label="功能選單"></nav>
    </aside>
    <div class="app-main">
      <header class="topbar no-print">
        <div class="brand">
          <img class="brand-logo" src="/images/northgo-logo.png?v=4" alt="NorthGO">
          <div>
            <p class="eyebrow">Northgo Inc. Kaohsiung Branch</p>
            <h1>角色管理</h1>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" class="btn ghost nav-toggle" id="nav-open" aria-expanded="false" aria-controls="sidenav">選單</button>
          <span id="current-user" class="current-user"></span>
          <button type="button" class="btn ghost" id="btn-logout">登出</button>
        </div>
      </header>

      <main>
        <div class="row-between">
          <h2>角色</h2>
          <button type="button" class="btn" id="btn-new">新增角色</button>
        </div>
        <p class="hint">內建角色不能刪除。管理員的權限不能拿掉。已有帳號使用的角色不能刪除，停用中的帳號也算。</p>
        <p id="page-status" class="page-status" role="status"></p>
        <div class="table-scroll">
          <table class="user-table">
            <thead>
              <tr>
                <th>名稱</th>
                <th>類型</th>
                <th>權限</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="role-rows"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <div id="nav-backdrop" class="nav-backdrop no-print" hidden></div>

  <dialog id="role-dialog">
    <form id="role-form" class="user-form" method="post" action="#" autocomplete="off">
      <h3 id="dialog-title">新增角色</h3>
      <label>名稱
        <input id="field-label" name="label" maxlength="40" required>
      </label>
      <fieldset>
        <legend>權限</legend>
        <div id="perm-grid" class="perm-grid"></div>
      </fieldset>
      <p id="form-hint" class="hint"></p>
      <p id="form-error" class="page-status error" role="alert"></p>
      <div class="row-actions">
        <button type="button" class="btn ghost" id="btn-cancel">取消</button>
        <button type="submit" class="btn" id="btn-save">儲存</button>
      </div>
    </form>
  </dialog>

  <script src="/js/nav.js?v=20261127a"></script>
  <script src="/admin/roles.js?v=20261127a"></script>
</body>
</html>
