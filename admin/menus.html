<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>選單管理｜物流報價系統</title>
  <link rel="stylesheet" href="/css/styles.css?v=20261126e">
  <link rel="stylesheet" href="/admin/users.css?v=20261126e">
</head>
<body>
  <div class="app-shell">
    <aside id="sidenav" class="sidenav no-print">
      <div class="sidenav-head">
        <p class="sidenav-label">物流報價</p>
        <button type="button" id="nav-close" class="nav-close">關閉</button>
      </div>
      <nav id="sidenav-tree" aria-label="功能選單"></nav>
    </aside>
    <div class="app-main">
      <header class="topbar no-print">
        <div class="brand">
          <img class="brand-logo" src="/images/northgo-logo.png?v=4" alt="NorthGO">
          <div>
            <p class="eyebrow">Northgo Inc. Kaohsiung Branch</p>
            <h1>選單管理</h1>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" class="btn ghost nav-toggle" id="nav-open" aria-expanded="false" aria-controls="sidenav">選單</button>
          <span id="current-user" class="current-user"></span>
          <button type="button" class="btn ghost" id="btn-logout">登出</button>
        </div>
      </header>

      <main class="view-page">
        <div class="row-between">
          <h2>選單</h2>
          <div class="row-actions">
            <button type="button" class="btn" id="btn-add-group">新增群組</button>
            <button type="button" class="btn" id="btn-add-item">新增項目</button>
          </div>
        </div>
        <p class="hint">內建頁面不能刪除，只能隱藏。帳號管理、選單管理和系統設定不能對管理員隱藏。自己加的項目是連結，不會變成新功能。</p>
        <p id="page-status" class="page-status" role="status"></p>
        <div id="menu-tree"></div>
      </main>
    </div>
  </div>
  <div id="nav-backdrop" class="nav-backdrop no-print" hidden></div>

  <dialog id="menu-dialog">
    <form id="menu-form" class="user-form" method="dialog">
      <h3 id="dialog-title">新增</h3>
      <label id="label-field">名稱
        <input id="field-label" maxlength="40" required>
      </label>
      <label id="parent-field">放進群組
        <select id="field-parent"></select>
      </label>
      <label id="href-field">連結
        <input id="field-href" placeholder="/ 開頭，或 https 網址">
      </label>
      <fieldset id="role-field">
        <legend>哪些角色看得到</legend>
        <label class="check"><input type="checkbox" name="role" value="admin" checked> 管理員</label>
        <label class="check"><input type="checkbox" name="role" value="sales"> 業務</label>
        <label class="check"><input type="checkbox" name="role" value="service"> 客服</label>
      </fieldset>
      <p id="form-error" class="page-status error" role="alert"></p>
      <div class="row-actions">
        <button type="button" class="btn ghost" id="btn-cancel">取消</button>
        <button type="submit" class="btn" id="btn-save">儲存</button>
      </div>
    </form>
  </dialog>

  <script src="/js/nav.js?v=20261126e"></script>
  <script src="/admin/menus.js?v=20261126e"></script>
</body>
</html>
